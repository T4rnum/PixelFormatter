name: Bug report
description: Report a reproducible processing or interface problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Include settings, dimensions, and a shareable sample if possible. Do not attach private images.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
